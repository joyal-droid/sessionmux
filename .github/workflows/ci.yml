name: CI

on:
  push:
    branches: [main, macos]
  pull_request:
  # Weekly, so new RustSec advisories against an unchanged Cargo.lock are reported.
  schedule:
    - cron: '0 6 * * 1'

# Every job only reads the repository; a job that needs more says so itself.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Updated by hand together with release.yml (Dependabot does not track it).
  RUST_TOOLCHAIN: '1.99.1'

# Every action is pinned to a full commit SHA; the comment names the release it belongs to.
# Dependabot (.github/dependabot.yml) proposes updates to these pins.
#
# Build, lint and test steps keep their output in ci-logs/ and mark a failure there with the
# step's name; the last step of the job then reports the end of each failed step's output as an
# error annotation, which can be read on the run page without signing in.
jobs:
  fmt:
    name: Format
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt
          rustup default $env:RUST_TOOLCHAIN
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component clippy
          rustup default $env:RUST_TOOLCHAIN
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          cmd /c "cargo clippy --all-targets --locked -- -D warnings 2>&1" | Tee-Object -FilePath ci-logs/clippy.log
          if ($LASTEXITCODE -ne 0) { 'Clippy' | Set-Content ci-logs/clippy.failed; exit $LASTEXITCODE }

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            # Colour codes go first, so compiler errors match at the start of a line.
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            # The failing tests and compiler errors first, then the end of the output, in pieces
            # small enough for one annotation each.
            { grep -E -A8 '^---- |panicked at|^error(\[|:)' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check reports the advisories it finds as a check run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: false
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build, test and smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      # Same flags as installer\build.ps1: no absolute path of the runner may end up in the exe,
      # the PE timestamp is deterministic (/Brepro) and the build date is the commit date.
      # Set before the cache step so the cache key follows the flags.
      - name: Remap build paths and fix the build date
        shell: pwsh
        run: |
          $userProfile = $env:USERPROFILE
          $cargoHome = if ($env:CARGO_HOME) { $env:CARGO_HOME } else { Join-Path $userProfile '.cargo' }
          $rustupHome = if ($env:RUSTUP_HOME) { $env:RUSTUP_HOME } else { Join-Path $userProfile '.rustup' }
          $pairs = @(@($userProfile, '/home'), @($cargoHome, '/cargo'), @($rustupHome, '/rustc'), @($env:GITHUB_WORKSPACE, '/src'))
          $flags = @($pairs | ForEach-Object { "--remap-path-prefix=$([IO.Path]::GetFullPath($_[0]).TrimEnd('\'))=$($_[1])" })
          $flags += '-Clink-arg=/DEBUG:NONE'
          $flags += '-Clink-arg=/Brepro'
          $value = $flags -join ' '
          Write-Host "RUSTFLAGS: $value"
          "RUSTFLAGS=$value" >> $env:GITHUB_ENV
          $epoch = [long](git log -1 --format=%ct)
          $date = [DateTimeOffset]::FromUnixTimeSeconds($epoch).UtcDateTime.ToString('yyyy-MM-dd')
          Write-Host "SOURCE_DATE_EPOCH: $epoch, SESSIONMUX_BUILD_DATE: $date"
          "SOURCE_DATE_EPOCH=$epoch" >> $env:GITHUB_ENV
          "SESSIONMUX_BUILD_DATE=$date" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Build (release)
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          cmd /c "cargo build --release --locked 2>&1" | Tee-Object -FilePath ci-logs/build.log
          if ($LASTEXITCODE -ne 0) { 'Build (release)' | Set-Content ci-logs/build.failed; exit $LASTEXITCODE }

      - name: Privacy scan
        shell: pwsh
        env:
          # Extra words for the privacy scan that are kept out of the repository (optional secret).
          SESSIONMUX_PRIVACY_TERMS: ${{ secrets.SESSIONMUX_PRIVACY_TERMS }}
        run: |
          & .\scripts\check-binary-privacy.ps1 target\release\Sessionmux.exe (Get-ChildItem docs -Recurse -Filter *.png).FullName
          exit $LASTEXITCODE

      - name: SHA-256 of Sessionmux.exe
        shell: pwsh
        run: (Get-FileHash -Algorithm SHA256 -LiteralPath target\release\Sessionmux.exe).Hash.ToLowerInvariant()

      - name: Test
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          New-Item -ItemType Directory -Force ci-logs | Out-Null
          cmd /c "cargo test --locked 2>&1" | Tee-Object -FilePath ci-logs/test.log
          if ($LASTEXITCODE -ne 0) { 'Test' | Set-Content ci-logs/test.failed; exit $LASTEXITCODE }

      - name: Smoke
        shell: pwsh
        env:
          SESSIONMUX_SMOKE_FIXTURE: '1'
        run: |
          # Sessionmux.exe is a GUI-subsystem exe: start it explicitly and wait for its exit code.
          $p = Start-Process -FilePath 'target\release\Sessionmux.exe' -ArgumentList '--smoke' -NoNewWindow -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Error 'smoke run timed out'; exit 1 }
          Write-Host "smoke exit code: $($p.ExitCode)"
          exit $p.ExitCode

      - name: Upload smoke captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-captures
          path: smoke/*.png
          if-no-files-found: warn

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            # Colour codes go first, so compiler errors match at the start of a line.
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            # The failing tests and compiler errors first, then the end of the output, in pieces
            # small enough for one annotation each.
            { grep -E -A8 '^---- |panicked at|^error(\[|:)' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done

  macos:
    name: macOS build and test
    # Apple silicon.
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Every part of the macOS app is implemented: no placeholder that only reports
      # "unsupported" may remain.
      - name: No placeholders left
        run: |
          mkdir -p ci-logs
          if grep -rn 'unsupported(' src/platform/macos > ci-logs/stubs.log; then
            cat ci-logs/stubs.log
            echo 'No placeholders left' > ci-logs/stubs.failed
            exit 1
          fi
          echo 'none found'

      - name: Clippy
        run: |
          mkdir -p ci-logs
          cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee ci-logs/clippy.log \
            || { echo 'Clippy' > ci-logs/clippy.failed; exit 1; }

      # The hook helper tests run this build of the app.
      - name: Build
        run: |
          mkdir -p ci-logs
          cargo build --locked 2>&1 | tee ci-logs/build.log \
            || { echo 'Build' > ci-logs/build.failed; exit 1; }

      # Every test's output is kept, so the tests that could not check something on this runner
      # are reported by the next step.
      - name: Test
        run: |
          mkdir -p ci-logs
          cargo test --locked -- --show-output 2>&1 | tee ci-logs/test.log \
            || { echo 'Test' > ci-logs/test.failed; exit 1; }

      # Each test that skipped a check says so in its output; every such line becomes a warning
      # on the run page and a line in the job summary. The stand-in Claude (built with cc), the
      # link-handler round trip and the hook helper tests always run on this runner, so a skip
      # of one of them fails the step.
      - name: Skipped checks
        run: |
          perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' ci-logs/test.log \
            | awk '/^---- .* (stdout|stderr) ----$/ { name = $2; next }
                   /^(successes|failures):$/ { name = "" }
                   name != "" && /skipped|not checked/ { print name ": " $0 }' > ci-logs/skips.txt
          {
            echo '### Checks the tests could not make on this runner'
            if [ -s ci-logs/skips.txt ]; then sed 's/^/- /' ci-logs/skips.txt; else echo 'None.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Skipped check::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done < ci-logs/skips.txt
          if grep -E 'skipped: (no C compiler|no built)' ci-logs/skips.txt; then
            echo 'A test that must run on this runner was skipped.'
            exit 1
          fi

      # Python for dmgbuild, which writes the disk image window (scripts/bundle-macos.sh).
      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          update-environment: false

      # The universal Sessionmux.app (arm64 + x86_64) exactly as a release builds it, with the
      # disk image and the zip. The script also checks what it made: plutil -lint, codesign
      # --verify --strict --all-architectures, lipo -verify_arch, the disk image mounts and holds
      # the app and the Applications link, the disk image window matches
      # packaging/macos/dmg-settings.py (background picture, volume icon, .DS_Store layout), the
      # zip extracts to an app with a valid signature, and the bundled binary passes --smoke and
      # --notify-hook. Gatekeeper (spctl) is expected to reject an ad-hoc signed app; its answer is
      # printed and does not fail the step.
      - name: Bundle
        env:
          SESSIONMUX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p ci-logs
          sh scripts/bundle-macos.sh 0.0.0-ci dist-macos 2>&1 | tee ci-logs/bundle.log \
            || { echo 'Bundle' > ci-logs/bundle.failed; exit 1; }

      # The scan's report is kept in ci-logs/ (without the lines that mask the private terms),
      # so its hits are reported as annotations when it fails. Everything in the app except the
      # icon is scanned: the icon is compressed image data packed from the PNG files in
      # assets/macos/Sessionmux.iconset, where short random byte runs can look like a pattern.
      - name: Privacy scan
        env:
          # Extra words for the privacy scan that are kept out of the repository (optional secret).
          SESSIONMUX_PRIVACY_TERMS: ${{ secrets.SESSIONMUX_PRIVACY_TERMS }}
        run: |
          mkdir -p ci-logs
          set +e
          c=dist-macos/Sessionmux.app/Contents
          pwsh -NoProfile -File scripts/check-binary-privacy.ps1 "$c/MacOS" "$c/Info.plist" "$c/PkgInfo" \
            "$c/_CodeSignature" dist-macos/BUILDINFO-macOS.txt > ci-logs/privacy.raw 2>&1
          code=$?
          set -e
          cat ci-logs/privacy.raw
          grep -v '^::add-mask::' ci-logs/privacy.raw > ci-logs/privacy.log || true
          rm -f ci-logs/privacy.raw
          if [ "$code" -ne 0 ]; then
            echo 'Privacy scan' > ci-logs/privacy.failed
            exit 1
          fi

      - name: SHA-256 of the macOS files
        run: cat dist-macos/SHA256SUMS-macos

      # The hook helpers exit 0 with no app running, whatever they are given.
      - name: Hook helper CLI
        run: |
          mkdir -p ci-logs
          run() {
            input=$1
            shift
            printf '%s' "$input" | dist-macos/Sessionmux.app/Contents/MacOS/Sessionmux "$@" || {
              echo "Sessionmux $* with input '$input' exited with $?" | tee -a ci-logs/hooks.log
              echo 'Hook helper CLI' > ci-logs/hooks.failed
              exit 1
            }
            echo "Sessionmux $* with input '$input': exit 0" | tee -a ci-logs/hooks.log
          }
          run '{}' --notify-hook
          run 'not json' --notify-hook
          run '' --notify-hook
          run '{}' --approve-hook
          run 'not json' --approve-hook
          run '' --approve-hook

      # The self-check of the bundled app with the demo data: floating button and panel
      # captures, the panel's requests answered, memory figures. A crash, a hang or a result
      # other than {"ok":true} fails the step; the captures are uploaded below.
      - name: Smoke
        env:
          SESSIONMUX_SMOKE_FIXTURE: '1'
          SESSIONMUX_SMOKE_GESTURE: '1'
        run: |
          mkdir -p ci-logs
          set +e
          perl -e 'alarm shift; exec @ARGV or die' 90 dist-macos/Sessionmux.app/Contents/MacOS/Sessionmux --smoke > ci-logs/smoke.log 2>&1
          code=$?
          set -e
          # The app's own log goes into the step log, so a failure report shows it too.
          for f in smoke/userData/*.log; do [ -e "$f" ] && cat "$f" >> ci-logs/smoke.log; done
          echo "smoke exit code: $code" >> ci-logs/smoke.log
          cat ci-logs/smoke.log
          ls -l smoke/*.png || true
          if [ "$code" -ne 0 ] || ! grep -q '"ok":true' ci-logs/smoke.log; then
            echo 'Smoke' > ci-logs/smoke.failed
            exit 1
          fi
          # The gesture frame, the menu bar icon and the shortcut were each checked.
          for want in '"gesture":true' '"menuBar":{' 'smoke: tray shown' 'smoke: hotkey .* registered'; do
            if ! grep -q "$want" ci-logs/smoke.log; then
              echo "smoke: '$want' is missing from the output" | tee -a ci-logs/smoke.log
              echo 'Smoke' > ci-logs/smoke.failed
              exit 1
            fi
          done
          if [ ! -s smoke/gesture.png ]; then
            echo 'smoke: smoke/gesture.png was not written' | tee -a ci-logs/smoke.log
            echo 'Smoke' > ci-logs/smoke.failed
            exit 1
          fi

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-macos
          path: |
            ci-logs/smoke.log
            smoke/userData/*.log
            smoke/*.png
          if-no-files-found: warn

      - name: Upload the app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sessionmux-macos
          path: |
            dist-macos/Sessionmux-macOS.dmg
            dist-macos/Sessionmux-macOS.zip
            dist-macos/SHA256SUMS-macos
            dist-macos/BUILDINFO-macOS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            # Colour codes go first, so compiler errors match at the start of a line.
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            # The test output also holds every passing test's output; only the failures are reported.
            perl -i -ne 'print unless /^successes:$/ .. /^(failures:|test result:.*)$/' "$plain"
            # The failing tests and compiler errors first, then the end of the output, in pieces
            # small enough for one annotation each.
            { grep -E -A8 '^---- |panicked at|^error(\[|:)|^bundle-macos: |^FOUND |^check-binary-privacy: ' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done

  # The same tests and self-check on an Intel Mac and on the newest macOS. On macOS 26.4 and
  # later every change of the link handler waits for a person to answer a system question, so
  # the tests check that the app knows this and skip the round trip with a printed reason.
  macos-more:
    name: macOS test (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Intel
            runner: macos-15-intel
          - label: macOS 26
            runner: macos-26
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.runner }}

      - name: Build (release)
        run: |
          mkdir -p ci-logs
          uname -m
          sw_vers
          cargo build --release --locked 2>&1 | tee ci-logs/build.log \
            || { echo 'Build (release)' > ci-logs/build.failed; exit 1; }

      - name: Test
        run: |
          mkdir -p ci-logs
          cargo test --locked -- --show-output 2>&1 | tee ci-logs/test.log \
            || { echo 'Test' > ci-logs/test.failed; exit 1; }

      # As in the macOS job: every skipped check becomes a warning and a line in the summary.
      - name: Skipped checks
        run: |
          perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' ci-logs/test.log \
            | awk '/^---- .* (stdout|stderr) ----$/ { name = $2; next }
                   /^(successes|failures):$/ { name = "" }
                   name != "" && /skipped|not checked/ { print name ": " $0 }' > ci-logs/skips.txt
          {
            echo "### Checks the tests could not make on this runner ($(sw_vers -productVersion), $(uname -m))"
            if [ -s ci-logs/skips.txt ]; then sed 's/^/- /' ci-logs/skips.txt; else echo 'None.'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            echo "::warning title=Skipped check::$(printf '%s' "$line" | sed 's/%/%25/g')"
          done < ci-logs/skips.txt
          if grep -E 'skipped: (no C compiler|no built)' ci-logs/skips.txt; then
            echo 'A test that must run on this runner was skipped.'
            exit 1
          fi

      - name: Hook helper CLI
        run: |
          mkdir -p ci-logs
          run() {
            input=$1
            shift
            printf '%s' "$input" | target/release/Sessionmux "$@" || {
              echo "Sessionmux $* with input '$input' exited with $?" | tee -a ci-logs/hooks.log
              echo 'Hook helper CLI' > ci-logs/hooks.failed
              exit 1
            }
            echo "Sessionmux $* with input '$input': exit 0" | tee -a ci-logs/hooks.log
          }
          run '{}' --notify-hook
          run 'not json' --notify-hook
          run '' --notify-hook
          run '{}' --approve-hook
          run 'not json' --approve-hook
          run '' --approve-hook

      - name: Smoke
        env:
          SESSIONMUX_SMOKE_FIXTURE: '1'
          SESSIONMUX_SMOKE_GESTURE: '1'
        run: |
          mkdir -p ci-logs
          set +e
          perl -e 'alarm shift; exec @ARGV or die' 90 target/release/Sessionmux --smoke > ci-logs/smoke.log 2>&1
          code=$?
          set -e
          for f in smoke/userData/*.log; do [ -e "$f" ] && cat "$f" >> ci-logs/smoke.log; done
          echo "smoke exit code: $code" >> ci-logs/smoke.log
          cat ci-logs/smoke.log
          ls -l smoke/*.png || true
          if [ "$code" -ne 0 ] || ! grep -q '"ok":true' ci-logs/smoke.log; then
            echo 'Smoke' > ci-logs/smoke.failed
            exit 1
          fi
          for want in '"gesture":true' '"menuBar":{' 'smoke: tray shown' 'smoke: hotkey .* registered'; do
            if ! grep -q "$want" ci-logs/smoke.log; then
              echo "smoke: '$want' is missing from the output" | tee -a ci-logs/smoke.log
              echo 'Smoke' > ci-logs/smoke.failed
              exit 1
            fi
          done

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-macos-${{ matrix.runner }}
          path: |
            ci-logs/smoke.log
            smoke/userData/*.log
            smoke/*.png
          if-no-files-found: warn

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            perl -i -ne 'print unless /^successes:$/ .. /^(failures:|test result:.*)$/' "$plain"
            { grep -E -A8 '^---- |panicked at|^error(\[|:)' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done

  # Switching accounts on a real Mac desktop: the app installed from the disk image, the real
  # Claude Desktop with two accounts open, and real mouse clicks on the panel and the floating
  # button. scripts/macos-focus-check.sh says what each step checks; every step's result is a
  # notice on the run page, and the result file, the app's log and screenshots are uploaded.
  macos-focus:
    name: macOS focus check (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          update-environment: false

      # The same universal app and disk image as the macOS build job.
      - name: Bundle
        env:
          SESSIONMUX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p ci-logs
          sh scripts/bundle-macos.sh 0.0.0-ci dist-macos 2>&1 | tee ci-logs/bundle.log \
            || { echo 'Bundle' > ci-logs/bundle.failed; exit 1; }

      - name: Install Sessionmux from the disk image
        run: |
          mkdir -p ci-logs
          {
            mnt=$(mktemp -d)
            hdiutil attach dist-macos/Sessionmux-macOS.dmg -nobrowse -readonly -mountpoint "$mnt"
            rm -rf /Applications/Sessionmux.app
            ditto "$mnt/Sessionmux.app" /Applications/Sessionmux.app
            hdiutil detach "$mnt"
            codesign --verify --strict /Applications/Sessionmux.app
            echo "installed $(defaults read /Applications/Sessionmux.app/Contents/Info.plist CFBundleShortVersionString)"
          } 2>&1 | tee ci-logs/install.log || { echo 'Install Sessionmux' > ci-logs/install.failed; exit 1; }

      - name: Install Claude Desktop
        run: |
          mkdir -p ci-logs
          {
            brew install --cask claude
            # Lets Claude's first start run without the "downloaded from the internet" dialog,
            # which nobody can answer on a runner.
            xattr -dr com.apple.quarantine /Applications/Claude.app \
              || sudo xattr -dr com.apple.quarantine /Applications/Claude.app || true
          } 2>&1 | tee ci-logs/claude.log || { echo 'Install Claude Desktop' > ci-logs/claude.failed; exit 1; }

      - name: Focus check
        env:
          FOCUS_RUNNER: ${{ matrix.runner }}
        run: |
          mkdir -p ci-logs
          bash scripts/macos-focus-check.sh focus-out 2>&1 | tee ci-logs/focus.log \
            || { echo 'Focus check' > ci-logs/focus.failed; exit 1; }

      - name: Upload focus check output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: focus-check-${{ matrix.runner }}
          path: |
            focus-out/
            ci-logs/focus.log
          if-no-files-found: warn

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            # Workflow commands in the output were already reported as annotations.
            perl -i -ne 'print unless /^::/' "$plain"
            { grep -E -A8 '^error(\[|:)|^bundle-macos: |^focus-check: ' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done

  # Two macOS users on one Mac at the same time: each gets its own instance lock and socket,
  # neither reaches the other's socket, and a "show" request stays with its own user. The script
  # creates a throwaway second user and deletes it again.
  macos-two-user:
    name: macOS two users
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Two users
        run: |
          mkdir -p ci-logs
          sh scripts/macos-two-user.sh 2>&1 | tee ci-logs/two-user.log \
            || { echo 'Two users' > ci-logs/two-user.failed; exit 1; }

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            { grep -E -A8 '^---- |panicked at|^error(\[|:)|^macos-two-user: ' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done

  # Weekly, and on every push to the macos branch: the same commit built twice, the second time
  # from another folder, must give the same universal binary bit for bit.
  macos-repro:
    name: macOS reproducible build
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/macos')
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      # Python for dmgbuild, which writes the disk image window (scripts/bundle-macos.sh).
      - name: Set up Python
        id: python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'
          update-environment: false

      - name: Build twice and compare
        env:
          SESSIONMUX_BUNDLE_SKIP_RUN: '1'
          SESSIONMUX_PYTHON: ${{ steps.python.outputs.python-path }}
        run: |
          mkdir -p ci-logs
          {
            sh scripts/bundle-macos.sh 0.0.0-ci "$RUNNER_TEMP/first"
            second="$RUNNER_TEMP/second-checkout"
            rsync -a --exclude /target --exclude /ci-logs ./ "$second/"
            (cd "$second" && sh scripts/bundle-macos.sh 0.0.0-ci "$RUNNER_TEMP/second")
          } > ci-logs/repro.log 2>&1 || { tail -n 60 ci-logs/repro.log; echo 'Build twice' > ci-logs/repro.failed; exit 1; }
          line='  Sessionmux.app/Contents/MacOS/Sessionmux$'
          a=$(grep "$line" "$RUNNER_TEMP/first/SHA256SUMS-macos")
          b=$(grep "$line" "$RUNNER_TEMP/second/SHA256SUMS-macos")
          echo "first:  $a"
          echo "second: $b"
          {
            echo '### Reproducible macOS build'
            echo "- first build: \`$a\`"
            echo "- second build, other folder: \`$b\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$a" ] || [ "$a" != "$b" ]; then
            echo 'The two builds of the same commit differ.' | tee -a ci-logs/repro.log
            echo 'Build twice' > ci-logs/repro.failed
            exit 1
          fi

      - name: Report failed steps
        if: failure()
        shell: bash
        run: |
          for f in ci-logs/*.failed; do
            [ -e "$f" ] || continue
            title=$(tr -d '\r\n' < "$f" | sed 's/%/%25/g; s/:/%3A/g; s/,/%2C/g')
            log="${f%.failed}.log"
            plain="$f.plain"
            perl -pe 's/\e\[[0-9;?]*[A-Za-z]//g' "$log" > "$plain"
            { grep -E -A8 '^error(\[|:)|^bundle-macos: ' "$plain" | head -n 400; echo '[...]'; tail -n 25 "$plain"; } \
              > "$f.txt"
            split -b 3500 "$f.txt" "$f.part."
            for p in $(ls "$f".part.* | head -n 8); do
              body=$(perl -pe 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g' "$p")
              echo "::error title=$title log::$body"
            done
          done
