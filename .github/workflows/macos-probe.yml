name: macOS probe

# Records how Claude Desktop behaves on GitHub's macOS runners (several data folders at once,
# argument reading, the claude:// link handler) and publishes the answers as a table. It is never
# a required check and uses no secrets; a "no" or "unknown" answer still passes, and only a crash
# of the probe script fails the job.
on:
  workflow_dispatch:
  push:
    branches: [macos]
    paths:
      - scripts/macos-probe.sh
      - .github/workflows/macos-probe.yml

permissions:
  contents: read

concurrency:
  group: macos-probe-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to a full commit SHA; the comment names the release it belongs to.
jobs:
  probe:
    name: Probe (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PROBE_RUNNER: ${{ matrix.runner }}
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A missing Claude is reported in the table instead of failing the job.
      - name: Install Claude Desktop
        continue-on-error: true
        run: |
          brew install --cask claude
          # Lets the first start of Claude run without the "downloaded from the internet" dialog,
          # which nobody can answer on a runner.
          xattr -dr com.apple.quarantine /Applications/Claude.app || sudo xattr -dr com.apple.quarantine /Applications/Claude.app || true

      - name: Run probe
        run: bash scripts/macos-probe.sh "probe-$PROBE_RUNNER.txt"

      - name: Show table
        if: always()
        run: |
          file="probe-$PROBE_RUNNER.txt"
          if [ -f "$file" ]; then
            cat "$file"
          else
            echo "No result table: the probe did not finish." >"$file"
          fi
          # One annotation, readable without signing in; newlines are escaped as the
          # workflow-command format requires.
          body="$(awk '{ gsub(/%/, "%25"); gsub(/\r/, ""); printf "%s%%0A", $0 }' "$file")"
          echo "::notice title=probe $PROBE_RUNNER::$body"

      - name: Upload table
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-probe-${{ matrix.runner }}
          path: probe-${{ matrix.runner }}.txt
          if-no-files-found: warn
