name: Release

on:
  push:
    tags: ['v*']

# Read-only by default. Only the publish job, which runs no build code, asks for more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The Rust release used for published builds. Updated by hand (Dependabot does not track it);
  # BUILDINFO.txt in every release records it together with the MSVC and NSIS versions.
  RUST_TOOLCHAIN: '1.99.1'
  # makensis version installed from Chocolatey; the build stops if a different one is found.
  NSIS_VERSION: '3.10'
  # Labels the macOS section of a release as a preview: built and checked on GitHub's macOS
  # machines, not yet tried on a real Mac.
  MACOS_PREVIEW: 'true'

# Every action is pinned to a full commit SHA; the comment names the release it belongs to.
#
# Two kinds of tag:
#   v1.2.3            a release of a commit on main: Windows only, published as the latest release.
#   v1.2.3-preview.4  a preview of a commit on the macos branch: the same Windows build plus the
#                     macOS app, published as a pre-release, so releases/latest keeps pointing
#                     at the newest stable release.
jobs:
  checks:
    name: Tag, tests and lints
    runs-on: windows-latest
    permissions:
      contents: read
      # read the CI runs of a preview's commit
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      preview: ${{ steps.version.outputs.preview }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # full history, so the tagged commit can be checked against its branch
          fetch-depth: 0

      - name: Check the tag against Cargo.toml
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $line = Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)"' | Select-Object -First 1
          $version = $line.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:TAG) {
            Write-Error "tag $env:TAG does not match Cargo.toml version $version"
            exit 1
          }
          # The only pre-release form is x.y.z-preview.n.
          $preview = $version.Contains('-')
          if ($preview -and $version -cnotmatch '^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$') {
            Write-Error "version $version is neither x.y.z nor x.y.z-preview.n"
            exit 1
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "preview=$(if ($preview) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # A release is built only from a commit that is already on main, that is, one that went
      # through a pull request and CI. A preview is built only from a commit on the macos branch.
      - name: Check that the tagged commit is on its branch
        shell: pwsh
        env:
          PREVIEW: ${{ steps.version.outputs.preview }}
        run: |
          $branch = if ($env:PREVIEW -eq 'true') { 'macos' } else { 'main' }
          $commit = git rev-parse "$env:GITHUB_SHA^{commit}"
          git merge-base --is-ancestor $commit "origin/$branch"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "the tagged commit $commit is not on $branch"
            exit 1
          }

      # The macos branch takes direct pushes, not pull requests, so a preview also needs a CI run
      # of the tagged commit on that branch that passed in full (the macOS jobs included).
      - name: Check that CI passed on the tagged commit
        if: steps.version.outputs.preview == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $commit = git rev-parse "$env:GITHUB_SHA^{commit}"
          $uri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&branch=macos&event=push&per_page=20"
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $runs = @((Invoke-RestMethod -Uri $uri -Headers $headers).workflow_runs)
          $passed = @($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })
          if ($passed.Count -eq 0) {
            $seen = ($runs | ForEach-Object { "$($_.status)/$($_.conclusion)" }) -join ', '
            Write-Error "no passed CI run on macos for $commit (runs: $(if ($seen) { $seen } else { 'none' })); re-run this workflow once CI has passed"
            exit 1
          }
          "CI passed on $commit`: $($passed[0].html_url)"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal --component rustfmt --component clippy
          rustup default $env:RUST_TOOLCHAIN

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check reports the advisories it finds as a check run.
      checks: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        continue-on-error: false
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Builds and packages with read-only access: this job runs every dependency's build script,
  # so it holds no token that could publish, attest or write to the repository.
  build:
    name: Build installer
    needs: [checks, audit]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.checks.outputs.version }}
      PREVIEW: ${{ needs.checks.outputs.preview }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup default $env:RUST_TOOLCHAIN

      # Chocolatey checks the NSIS download against the checksum recorded in that package
      # version; the version printed by makensis is checked as well.
      - name: Install NSIS ${{ env.NSIS_VERSION }}
        shell: pwsh
        run: |
          choco install nsis --version=$env:NSIS_VERSION -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $found = (& $makensis /VERSION | Out-String).Trim()
          if ($found -ne "v$env:NSIS_VERSION") {
            Write-Error "expected makensis v$env:NSIS_VERSION, found '$found'"
            exit 1
          }

      # build.ps1 sets the path-remapping and /Brepro RUSTFLAGS, takes SESSIONMUX_BUILD_DATE and
      # SOURCE_DATE_EPOCH from the tagged commit and builds with --locked, so Sessionmux.exe can
      # be rebuilt bit for bit.
      - name: Build and package
        shell: pwsh
        env:
          # Extra words for the privacy scan that are kept out of the repository (optional secret).
          SESSIONMUX_PRIVACY_TERMS: ${{ secrets.SESSIONMUX_PRIVACY_TERMS }}
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & .\installer\build.ps1 -Makensis $makensis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The versions of the tools that produced Sessionmux.exe, needed to rebuild it later.
      - name: Write BUILDINFO.txt
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $msvc = (Get-Content -LiteralPath (Join-Path $vs 'VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt') -TotalCount 1).Trim()
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $text = @(
            "Sessionmux $env:VERSION",
            "commit: $(git rev-parse HEAD)",
            "SOURCE_DATE_EPOCH: $(git log -1 --format=%ct)",
            '',
            ((rustc -vV) -join "`n"),
            ((cargo -V) -join "`n"),
            "MSVC tools (link.exe): $msvc",
            "NSIS: $((& $makensis /VERSION | Out-String).Trim())"
          ) -join "`n"
          Set-Content -LiteralPath dist\BUILDINFO.txt -Value $text -Encoding ascii
          Get-Content dist\BUILDINFO.txt

      # build.ps1 scans the exe, the staged files, the installer script and an uncompressed build
      # of the installer itself; they are scanned once more here, with BUILDINFO.txt, so a release
      # can never be published from an unchecked build.
      - name: Privacy scan
        shell: pwsh
        env:
          SESSIONMUX_PRIVACY_TERMS: ${{ secrets.SESSIONMUX_PRIVACY_TERMS }}
        run: |
          $name = "Sessionmux-Setup-$env:VERSION.exe"
          & .\scripts\check-binary-privacy.ps1 "dist\$name" target\release\Sessionmux.exe dist\BUILDINFO.txt dist\stage installer\sessionmux.nsi
          exit $LASTEXITCODE

      # Sessionmux-Setup.exe is a byte-identical copy of the versioned installer under a fixed
      # name, so releases/latest/download/Sessionmux-Setup.exe always serves the newest release.
      # SHA256SUMS lists both installer names, the Sessionmux.exe it contains and BUILDINFO.txt.
      # The exe is the file to compare after rebuilding the tag; the installer is not reproducible
      # (NSIS stamps it).
      - name: Write SHA256SUMS and release notes
        shell: pwsh
        run: |
          $version = $env:VERSION
          $name = "Sessionmux-Setup-$version.exe"
          Copy-Item -LiteralPath "dist\$name" -Destination dist\Sessionmux-Setup.exe
          $hash = { param($p) (Get-FileHash -Algorithm SHA256 -LiteralPath $p).Hash.ToLowerInvariant() }
          Set-Content -LiteralPath dist\SHA256SUMS -Encoding ascii -Value @(
            "$(& $hash "dist\$name")  $name",
            "$(& $hash dist\Sessionmux-Setup.exe)  Sessionmux-Setup.exe",
            "$(& $hash target\release\Sessionmux.exe)  Sessionmux.exe",
            "$(& $hash dist\BUILDINFO.txt)  BUILDINFO.txt"
          )
          Get-Content dist\SHA256SUMS
          # Release notes: the download link first, then the matching section of CHANGELOG.md,
          # then the hashes, the toolchain and how to verify, folded into a details block. The
          # publish job replaces @ATTESTATION_URL@ with the attestation link. In a preview the
          # Windows download comes first, then the macOS section, which the publish job puts in
          # place of @MACOS_SECTION@; the hashes of both builds replace @SHA256SUMS@ there.
          $text = Get-Content -Raw CHANGELOG.md
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]:|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Sessionmux $version" }
          $dl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/$name"
          $latest = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/Sessionmux-Setup.exe"
          $kb = [math]::Round((Get-Item -LiteralPath "dist\$name").Length / 1KB)
          $runIt = 'Run the file. If Windows shows "Windows protected your PC", choose **More info**, then **Run anyway**: the build is not code-signed yet, and the section at the end shows how to check it instead.'
          if ($env:PREVIEW -eq 'true') {
            $fixed = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$version/Sessionmux-Setup.exe"
            $stable = "https://github.com/$env:GITHUB_REPOSITORY/releases/latest"
            $download = @(
              '## Download',
              '',
              '### Windows',
              '',
              "**[$name]($dl)** · $kb KB · Windows 10/11 x64 · installs for your user, no administrator rights",
              '',
              $runIt,
              '',
              "[Sessionmux-Setup.exe]($fixed) is the same file under a fixed name. This is a pre-release; the newest stable release is always the [latest release]($stable).",
              '',
              '@MACOS_SECTION@'
            )
            $sums = '@SHA256SUMS@'
            $either = 'any file name of this release'
            $toolchain = 'Toolchain of the Windows build (also in `BUILDINFO.txt`; the macOS one is in `BUILDINFO-macOS.txt`):'
          } else {
            $download = @(
              '## Download',
              '',
              "**[$name]($dl)** · $kb KB · Windows 10/11 x64 · installs for your user, no administrator rights",
              '',
              $runIt,
              '',
              "[Sessionmux-Setup.exe]($latest) is the same file under a name that always points at the newest release."
            )
            $sums = (Get-Content -LiteralPath dist\SHA256SUMS) -join "`n"
            $either = 'either file name'
            $toolchain = 'Toolchain (also in `BUILDINFO.txt`):'
          }
          $verify = ($download + @(
            '',
            "## What's new in $version",
            '',
            $notes,
            '',
            '<details>',
            '<summary><b>Verify this download</b> (SHA-256, build provenance, toolchain)</summary>',
            '',
            'SHA-256 (also in `SHA256SUMS`):',
            '',
            '```',
            $sums,
            '```',
            '',
            "Build provenance (needs the GitHub CLI; the command accepts $either):",
            '',
            '```',
            "gh attestation verify $name --repo $env:GITHUB_REPOSITORY --signer-workflow $env:GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/v$version",
            '```',
            '',
            $toolchain,
            '',
            '```',
            ((Get-Content -LiteralPath dist\BUILDINFO.txt) -join "`n"),
            '```',
            '',
            'To rebuild: check out this tag, run `installer\build.ps1` with the toolchain above and compare the SHA-256 of `target\release\Sessionmux.exe` with the value above.',
            '',
            'Build provenance attestation: @ATTESTATION_URL@',
            '</details>'
          )) -join "`n"
          Set-Content -LiteralPath dist\notes.md -Value $verify -Encoding utf8

      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/Sessionmux-Setup-${{ env.VERSION }}.exe
            dist/Sessionmux-Setup.exe
            dist/SHA256SUMS
            dist/BUILDINFO.txt
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

  # Previews only: lints and tests of the macOS build (formatting is checked by the job above).
  checks-macos:
    name: macOS tests and lints
    needs: [checks]
    if: needs.checks.outputs.preview == 'true'
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy
          rustup default "$RUST_TOOLCHAIN"

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # The hook helper tests run this build of the app.
      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  # Previews only. Builds the universal Sessionmux.app (arm64 + x86_64), the disk image and the
  # zip with read-only access, like the Windows build job: no token that could publish, attest
  # or write to the repository. scripts/bundle-macos.sh also checks what it made (signature,
  # architectures, Info.plist, disk image and zip contents) and runs the bundled binary's
  # self-check.
  build-macos:
    name: Build macOS app
    needs: [checks, checks-macos, audit]
    if: needs.checks.outputs.preview == 'true'
    runs-on: macos-15
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build and package
        run: sh scripts/bundle-macos.sh "$VERSION" dist-macos

      # Everything in the app except the icon, which is compressed image data packed from the PNG
      # files in assets/macos/Sessionmux.iconset (short random byte runs there can look like a
      # pattern).
      - name: Privacy scan
        shell: pwsh
        env:
          SESSIONMUX_PRIVACY_TERMS: ${{ secrets.SESSIONMUX_PRIVACY_TERMS }}
        run: |
          $c = 'dist-macos/Sessionmux.app/Contents'
          & ./scripts/check-binary-privacy.ps1 "$c/MacOS" "$c/Info.plist" "$c/PkgInfo" "$c/_CodeSignature" dist-macos/BUILDINFO-macOS.txt
          exit $LASTEXITCODE

      # The macOS part of the release notes; the publish job puts it right after the Windows
      # download.
      - name: Write the macOS release notes
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          mb=$(awk -v b="$(stat -f %z dist-macos/Sessionmux-macOS.dmg)" 'BEGIN { printf "%.1f", b / 1048576 }')
          if [ "$MACOS_PREVIEW" = "true" ]; then heading='### macOS (preview)'; else heading='### macOS'; fi
          {
            echo "$heading"
            echo
            if [ "$MACOS_PREVIEW" = "true" ]; then
              echo '> **Preview, not yet verified on a Mac.** The macOS app passes the automated checks on GitHub'"'"'s macOS machines but has not been tried on a real Mac yet. It is signed ad hoc (no Apple Developer ID) and not notarized, so macOS asks you to confirm it once.'
              echo
            fi
            echo "**[Sessionmux-macOS.dmg]($base/Sessionmux-macOS.dmg)** · $mb MB · macOS 13 or later · one app for Apple silicon and Intel (Cowork needs Apple silicon)"
            echo
            echo "Also as a zip: [Sessionmux-macOS.zip]($base/Sessionmux-macOS.zip). The same files with the version in the name: [Sessionmux-$VERSION-macOS.dmg]($base/Sessionmux-$VERSION-macOS.dmg) · [Sessionmux-$VERSION-macOS.zip]($base/Sessionmux-$VERSION-macOS.zip)."
            echo
            echo '**First start**'
            echo
            echo '1. Open the disk image and drag **Sessionmux** onto **Applications**.'
            echo '2. Open Sessionmux from Applications. macOS says it cannot check the app for malicious software; choose **Done** (or **Cancel**).'
            echo '3. Open **System Settings > Privacy & Security**, scroll down to **Security** and choose **Open Anyway** next to the line about Sessionmux, then confirm with **Open Anyway** and your password.'
            echo
            echo 'You do this once; afterwards Sessionmux opens normally. It lives in the menu bar and has no Dock icon.'
            if [ "$MACOS_PREVIEW" = "true" ]; then
              echo
              echo '**Not yet verified on a Mac**'
              echo
              echo '- Signing in to an extra account with Google or Apple (sign-in link routing), including the "Use / Keep" questions macOS 26.4 and later asks. The automated checks switch the link handler to Sessionmux and back on macOS 15, but passing a sign-in link on to the right Claude window has not been tried yet. Signing in with an e-mail code is the safe way meanwhile.'
              echo '- Bringing a minimised Claude window, or one in another Space, to the front; whether the Accessibility switch is needed for that.'
              echo '- Open at login, and whether it survives an update.'
              echo '- The global shortcut on non-US keyboard layouts.'
              echo '- Two people using Sessionmux on the same Mac at the same time.'
              echo '- How Sessionmux behaves while Claude updates itself with several accounts open.'
              echo '- The look of the floating button and menu bar icon on real displays (the automated checks only see images).'
            fi
            echo
            echo '<details>'
            echo '<summary><b>Verify the macOS download</b> (SHA-256, build provenance, toolchain)</summary>'
            echo
            echo 'In the folder with the downloaded disk image and this release'"'"'s `SHA256SUMS`:'
            echo
            echo '```'
            echo "grep '  Sessionmux-macOS.dmg\$' SHA256SUMS | shasum -a 256 -c"
            echo "gh attestation verify Sessionmux-macOS.dmg --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/v$VERSION"
            echo '```'
            echo
            echo 'Toolchain (also in `BUILDINFO-macOS.txt`):'
            echo
            echo '```'
            cat dist-macos/BUILDINFO-macOS.txt
            echo '```'
            echo
            echo "To rebuild: check out this tag on a Mac with the toolchain above, run \`sh scripts/bundle-macos.sh $VERSION dist-macos\` and compare the SHA-256 of \`dist-macos/Sessionmux.app/Contents/MacOS/Sessionmux\` with its line in \`SHA256SUMS\`."
            echo '</details>'
          } > dist-macos/notes-macos.md
          cat dist-macos/notes-macos.md

      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-macos
          path: |
            dist-macos/Sessionmux-${{ env.VERSION }}-macOS.dmg
            dist-macos/Sessionmux-macOS.dmg
            dist-macos/Sessionmux-${{ env.VERSION }}-macOS.zip
            dist-macos/Sessionmux-macOS.zip
            dist-macos/SHA256SUMS-macos
            dist-macos/BUILDINFO-macOS.txt
            dist-macos/notes-macos.md
          if-no-files-found: error
          retention-days: 7

  # Attests and publishes the files built above. It checks out nothing and runs no build code.
  publish:
    name: Attest and create draft release
    needs: [checks, build]
    if: needs.checks.outputs.preview != 'true'
    runs-on: ubuntu-latest
    permissions:
      # create the draft release and upload its files
      contents: write
      # OIDC token that binds the provenance attestation to this workflow run
      id-token: write
      # store the attestation in this repository
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Check the files against SHA256SUMS
        working-directory: release
        # Sessionmux.exe is inside the installer, not a separate file; the other lines, both
        # installer names included, must match.
        run: tr -d '\r' < SHA256SUMS | grep -v '  Sessionmux\.exe$' | sha256sum --check --strict

      # No signing key exists: the attestation is signed with a short-lived certificate issued
      # for this workflow run's OIDC identity, so it can only come from release.yml on a tag.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/Sessionmux-Setup-${{ env.VERSION }}.exe
            release/Sessionmux-Setup.exe
            release/SHA256SUMS
            release/BUILDINFO.txt

      # The attestation link replaces the placeholder at the end of the notes; \, | and & in the
      # link are escaped so it is inserted as written.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          grep -q '@ATTESTATION_URL@' release/notes.md || { echo 'release/notes.md has no @ATTESTATION_URL@ placeholder' >&2; exit 1; }
          url=$(printf '%s' "$ATTESTATION_URL" | sed 's/[\\|&]/\\&/g')
          sed -i "s|@ATTESTATION_URL@|$url|" release/notes.md
          gh release create "$TAG" \
            "release/Sessionmux-Setup-$VERSION.exe" release/Sessionmux-Setup.exe \
            release/SHA256SUMS release/BUILDINFO.txt \
            --repo "$GITHUB_REPOSITORY" --title "Sessionmux $VERSION" --notes-file release/notes.md --draft

  # Previews only: attests and publishes the Windows and macOS files built above as one
  # pre-release, never marked as the latest release. It checks out nothing and runs no build code.
  publish-preview:
    name: Attest and create draft pre-release
    needs: [checks, build, build-macos]
    if: needs.checks.outputs.preview == 'true'
    runs-on: ubuntu-latest
    permissions:
      # create the draft release and upload its files
      contents: write
      # OIDC token that binds the provenance attestation to this workflow run
      id-token: write
      # store the attestation in this repository
      attestations: write
    env:
      VERSION: ${{ needs.checks.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files-macos
          path: release

      # One SHA256SUMS for both builds: the Windows lines, then the macOS lines. Sessionmux.exe
      # and the binary inside Sessionmux.app are not separate files of the release; every other
      # line must match.
      - name: Combine and check SHA256SUMS
        working-directory: release
        run: |
          tr -d '\r' < SHA256SUMS > SHA256SUMS-windows
          tr -d '\r' < SHA256SUMS-macos > SHA256SUMS-mac
          cat SHA256SUMS-windows SHA256SUMS-mac > SHA256SUMS
          rm SHA256SUMS-windows SHA256SUMS-mac SHA256SUMS-macos
          cat SHA256SUMS
          grep -v -e '  Sessionmux\.exe$' -e '  Sessionmux\.app/Contents/MacOS/Sessionmux$' SHA256SUMS \
            | sha256sum --check --strict

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/Sessionmux-Setup-${{ env.VERSION }}.exe
            release/Sessionmux-Setup.exe
            release/Sessionmux-${{ env.VERSION }}-macOS.dmg
            release/Sessionmux-macOS.dmg
            release/Sessionmux-${{ env.VERSION }}-macOS.zip
            release/Sessionmux-macOS.zip
            release/SHA256SUMS
            release/BUILDINFO.txt
            release/BUILDINFO-macOS.txt

      # The macOS section goes where the Windows notes hold @MACOS_SECTION@, the combined hashes
      # where they hold @SHA256SUMS@, and the attestation link replaces @ATTESTATION_URL@; \, |
      # and & in the link are escaped so it is inserted as written. The release is created as a
      # draft pre-release that is never marked as the latest release.
      - name: Create draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          for p in @MACOS_SECTION@ @SHA256SUMS@ @ATTESTATION_URL@; do
            grep -qF "$p" release/notes.md || { echo "release/notes.md has no $p placeholder" >&2; exit 1; }
          done
          sed -i -e '/^@MACOS_SECTION@\r\{0,1\}$/{r release/notes-macos.md' -e 'd}' release/notes.md
          sed -i -e '/^@SHA256SUMS@\r\{0,1\}$/{r release/SHA256SUMS' -e 'd}' release/notes.md
          if grep -q -e '@MACOS_SECTION@' -e '@SHA256SUMS@' release/notes.md; then
            echo 'a placeholder in release/notes.md was not replaced' >&2
            exit 1
          fi
          url=$(printf '%s' "$ATTESTATION_URL" | sed 's/[\\|&]/\\&/g')
          sed -i "s|@ATTESTATION_URL@|$url|" release/notes.md
          gh release create "$TAG" \
            "release/Sessionmux-Setup-$VERSION.exe" release/Sessionmux-Setup.exe \
            "release/Sessionmux-$VERSION-macOS.dmg" release/Sessionmux-macOS.dmg \
            "release/Sessionmux-$VERSION-macOS.zip" release/Sessionmux-macOS.zip \
            release/SHA256SUMS release/BUILDINFO.txt release/BUILDINFO-macOS.txt \
            --repo "$GITHUB_REPOSITORY" --title "Sessionmux $VERSION" --notes-file release/notes.md \
            --draft --prerelease --latest=false
