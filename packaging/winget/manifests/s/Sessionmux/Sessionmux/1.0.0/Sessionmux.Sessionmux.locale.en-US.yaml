ShortDescription: Switch between multiple Claude Desktop accounts and move your Code sessions with you.
Description: |-
  Sessionmux is a small native Windows app that runs several Claude Desktop accounts side by side,
  switches between them from a floating button, a tray icon or a hotkey, moves or copies
  Code-tab sessions between accounts (also while they are open), hands a session over when an
  account hits its plan limit, and can show waiting permission requests for approval in its panel.
  No telemetry and no network connections of its own.
  Sessionmux is an independent, unofficial open-source project. It is not affiliated with, endorsed by
  or sponsored by Anthropic, PBC. Claude is a trademark of Anthropic, PBC.
